<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admiral Yi Sun-sin — Top-Down Naval Tactics & Celestial Brush</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="gallery-column">
    <header>
      <h1>Admiral Yi Sun-sin: Top-Down Naval Tactics & Celestial Brush</h1>
      <div id="hud-status">Battle of Okpo (May 1592) • Maneuvers: 0/4</div>
    </header>
    <div id="chapter-tabs" class="controls-row" role="tablist" aria-label="Select Naval Battle"></div>
    <div class="controls-row" role="region" aria-label="Audio and Tide Controls">
      <button id="btn-mute" type="button">Unmute Strings & Drum (M)</button>
      <button id="btn-motion" type="button" class="active">Tide Motion: Playing (Space)</button>
      <button id="btn-reset" type="button">Restart Battle</button>
    </div>
    <div class="canvas-frame">
      <canvas id="imjin-canvas" width="640" height="480" aria-label="Top-Down Naval Tactical Chart"></canvas>
    </div>
    <div id="braille-meter" class="braille-row" aria-hidden="true">⠀⠀⠀⠀⠀</div>
    <div id="gesture-deck" class="gesture-deck" role="group" aria-label="Tactical Brush Orders"></div>
    <div id="narrative-voice" class="voice-box" role="status" aria-live="polite">Battle of Okpo (May 1592) — Sweep a WAVE (~) to align the Joseon vanguard with the northbound harbor tide.</div>
  </main>
  <script type="module" src="src/imjin-app.js"></script>
</body>
</html>
